[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-eeg-benchmark"
version = "0.1.0"
description = "Reproducible multi-dataset deep-learning benchmark for motor-imagery EEG"
requires-python = ">=3.11,<3.15"
dependencies = [
  "BCI2kReader @ git+https://github.com/neurotechcenter/BCI2kReader.git@9e8ecc3fcde58d2b41c2d2fcd8d23d88b412c08d",
  "braindecode==1.5.2",
  "matplotlib>=3.9",
  "mne==1.12.1",
  "moabb==1.5.0",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.17.1",
  "skorch==1.4.0",
  "statsmodels==0.14.6",
  "torch==2.12.1",
  "tqdm>=4.67",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
